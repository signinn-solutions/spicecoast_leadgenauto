version: '3.8'

services:
  leadgen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spicecoast-leadgen
    ports:
      - "5001:10000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=10000
      - SPICECOAST_DB_PATH=/var/data/spicecoast.sqlite
      - SENDER_MAILBOX=sales@thespicecoast.com
      - AUTO_SEND=false
      - TZ=Asia/Kolkata
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - TRUST_PROXY=1
      - HOSTINGER_MAILBOX_RESOURCE_ID=${HOSTINGER_MAILBOX_RESOURCE_ID:-}
      - DAILY_LEAD_LIMIT=${DAILY_LEAD_LIMIT:-200}
      - DAILY_REPLY_LIMIT=30
      # API Keys (Can be loaded from .env)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PLACES_PROJECT=${GOOGLE_PLACES_PROJECT:-default}
      - GOOGLE_PLACES_TEXT_PER_DAY=${GOOGLE_PLACES_TEXT_PER_DAY:-60}
      - GOOGLE_PLACES_TEXT_PER_MINUTE=${GOOGLE_PLACES_TEXT_PER_MINUTE:-20}
      - GOOGLE_PLACES_OTHER_PER_DAY=${GOOGLE_PLACES_OTHER_PER_DAY:-10}
      - GOOGLE_PLACES_OTHER_PER_MINUTE=${GOOGLE_PLACES_OTHER_PER_MINUTE:-5}
      - GOOGLE_PLACES_CONCURRENCY=${GOOGLE_PLACES_CONCURRENCY:-1}
      - GOOGLE_PLACES_REQUESTS_PER_SEARCH=${GOOGLE_PLACES_REQUESTS_PER_SEARCH:-60}
      - GOOGLE_PLACES_TEXT_COST_MICROS=${GOOGLE_PLACES_TEXT_COST_MICROS:-35000}
      - GOOGLE_PLACES_SEARCH_COST_MICROS=${GOOGLE_PLACES_SEARCH_COST_MICROS:-2100000}
      - GOOGLE_PLACES_DAILY_COST_MICROS=${GOOGLE_PLACES_DAILY_COST_MICROS:-2100000}
      - GOOGLE_PLACES_CRM_LICENSED=${GOOGLE_PLACES_CRM_LICENSED:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_SEARCH_MODEL=${DEEPSEEK_SEARCH_MODEL:-deepseek-flash}
      - MAX_LEADS_PER_SEARCH=${MAX_LEADS_PER_SEARCH:-1000}
      - HUNTER_API_KEY=${HUNTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - HOSTINGER_API_TOKEN=${HOSTINGER_API_TOKEN:-}
      - HOSTINGER_WEBHOOK_BEARER_TOKEN=${HOSTINGER_WEBHOOK_BEARER_TOKEN:-}
    volumes:
      - leadgen-data:/var/data
    restart: unless-stopped

volumes:
  leadgen-data:
